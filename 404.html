<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found - PMP Practice</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<style>
  :root{
    --bg:#FAFAF8; --surface:#FFFFFF; --ink:#16213E; --ink-soft:#4A5568; --ink-faint:#8890A0;
    --accent:#A9762C; --accent-soft:#F3E9D8; --line:#E6E4DD;
    --shadow: 0 1px 2px rgba(22,33,62,0.04), 0 8px 24px rgba(22,33,62,0.06);
  }
  [data-theme="dark"]{
    --bg:#12141C; --surface:#1A1D27; --ink:#EDEEF2; --ink-soft:#AEB3C4; --ink-faint:#6E7387;
    --accent:#D3A85C; --accent-soft:#2A2417; --line:#2C303F;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter', system-ui, sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    transition:background .2s ease, color .2s ease;
  }
  .wrap{max-width:480px; text-align:center; padding:24px;}
  .code{
    font-family:'Lora', serif; font-size:5rem; font-weight:700; color:var(--accent);
    line-height:1; margin-bottom:8px;
  }
  h1{font-size:1.5rem; margin-bottom:12px;}
  p{color:var(--ink-soft); margin-bottom:32px; line-height:1.6;}
  .btn-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:8px;
    font-weight:600; font-size:0.92rem; text-decoration:none; transition:transform .15s;
  }
  .btn-primary{background:var(--ink); color:var(--bg);}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-secondary{background:transparent; border:1px solid var(--line); color:var(--ink);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page wandered off scope.</h1>
    <p>The link you followed doesn't match anything here - maybe it moved, or maybe it was never approved through change control. Either way, let's get you back on track.</p>
    <div class="btn-row">
      <a href="index.html" class="btn btn-primary">Back to homepage →</a>
      <a href="index.html#mocks" class="btn btn-secondary">See the mocks</a>
    </div>
  </div>
</body>
</html>
